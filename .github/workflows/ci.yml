name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # --locked fails if uv.lock drifts from pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    # Throwaway database that lives only on the runner. CI never touches Supabase.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      # A forked chain (two branches adding the same next revision) fails here.
      - name: Single migration head
        run: test "$(uv run alembic heads | grep -c '(head)')" -eq 1

      - name: Upgrade to head
        run: uv run alembic upgrade head

      # Models and migrations must describe the same schema.
      - name: No model drift
        run: uv run alembic check

      # ADR-0004 relies on every migration being reversible.
      - name: Downgrade to base and back
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Integration tests
        run: uv run pytest -m integration -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
