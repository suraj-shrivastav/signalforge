[project]
name = "signalforge"
version = "0.1.0"
description = "AI-engineering intelligence platform: discover, research, verify, publish."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<3",
    "trafilatura>=2.2,<3",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalforge"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Illustrative snippets in the PRD and ADRs are prose, not source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "ANN", # flake8-annotations      - type hints everywhere
    "ARG", # flake8-unused-arguments
    "B",   # flake8-bugbear
    "BLE", # flake8-blind-except     - no bare except
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TRY", # tryceratops             - error-handling hygiene
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
# ANN401: `Any` is required by the Protocol seams in core/.
# TRY003: our typed errors carry contextual messages by design.
ignore = ["ANN401", "TRY003"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "apps"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = ["integration: needs Postgres; set TEST_DATABASE_URL (skipped otherwise)"]
